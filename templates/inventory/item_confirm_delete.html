{% extends "base.html" %}
{% block title %}Delete {{ item.name }} - Shop Inventory{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="mb-3">Delete "{{ item.name }}"?</h4>
            <p class="text-muted">This will permanently delete this item and all its movement history. This cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'inventory:item_detail' item.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
